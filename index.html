<!DOCTYPE html>
<html lang="ja" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>AURORA DRIFT — 極彩の回廊</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Chakra+Petch:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070f;--ink:#eaf3ff;--dim:#8ea1c4;--cy:#35e6ff;--mg:#ff2e88;--am:#ffc247;--am2:#ff7a2e;--gr:#7dff6b;--vi:#b06bff;--rd:#ff2e56;
--line:rgba(120,180,255,.22);--cut:12px;--sp:clamp(10px,2.2vh,26px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#03040b;color:var(--ink);font-family:'Noto Sans JP',system-ui,sans-serif;
font-size:clamp(12px,1.62vh,16px);overscroll-behavior:none;touch-action:none;user-select:none}
#app{position:fixed;inset:0;overflow:hidden;isolation:isolate}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.fx{position:absolute;inset:0;pointer-events:none}
#bg{background:radial-gradient(120% 100% at 50% 40%,#0a1130,#05070f 60%,#020309)}
#bg b{position:absolute;display:block;border-radius:50%;filter:blur(40px);opacity:.5;animation:drift 26s ease-in-out infinite alternate}
#bg .g1{width:70vw;height:70vw;left:-18vw;top:-32vw;background:radial-gradient(circle,rgba(53,230,255,.4),transparent 62%)}
#bg .g2{width:80vw;height:80vw;right:-26vw;bottom:-40vw;background:radial-gradient(circle,rgba(255,46,136,.32),transparent 64%);animation-delay:-9s}
#hlines{background:repeating-linear-gradient(90deg,rgba(120,190,255,.05) 0 1px,transparent 1px 46px);opacity:.45;
mask:linear-gradient(#000,transparent 55%);-webkit-mask:linear-gradient(#000,transparent 55%)}
.scan{background:repeating-linear-gradient(180deg,rgba(200,240,255,.05) 0 1px,transparent 1px 3px);opacity:.45;animation:scan 6s linear infinite}
@keyframes scan{to{transform:translateY(3px)}}
.vig{background:radial-gradient(125% 92% at 50% 46%,transparent 40%,rgba(2,3,10,.86))}
#speed{opacity:0;transition:opacity .18s;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(214,246,255,.2) 0 .34deg,transparent .34deg 2.3deg);
mask:radial-gradient(closest-side,transparent 40%,#000 99%);-webkit-mask:radial-gradient(closest-side,transparent 40%,#000 99%)}
@keyframes drift{to{transform:translate3d(6vw,4vh,0) scale(1.1)}}
#hurt{opacity:0;background:radial-gradient(120% 86% at 50% 50%,transparent 34%,rgba(255,46,86,.62))}
#hurt.on{animation:hurtA .55s ease-out}@keyframes hurtA{0%{opacity:1}100%{opacity:0}}
#heal{opacity:0;background:radial-gradient(120% 86% at 50% 50%,transparent 40%,rgba(53,230,255,.4))}
#heal.on{animation:hurtA .7s ease-out}
.edge{position:absolute;top:0;bottom:0;width:13%;opacity:0;pointer-events:none;transition:opacity .07s linear;z-index:4}
#eL{left:0;background:linear-gradient(90deg,rgba(255,46,86,.6),transparent)}
#eR{right:0;background:linear-gradient(270deg,rgba(255,46,86,.6),transparent)}
#eT{left:0;right:0;width:auto;height:16%;top:0;background:linear-gradient(180deg,rgba(255,46,86,.5),transparent)}
#eB{left:0;right:0;width:auto;height:16%;bottom:0;background:linear-gradient(0deg,rgba(255,46,86,.5),transparent)}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.55em;padding:.72em 1.35em;border:0;cursor:pointer;color:#03060f;
font-family:'Chakra Petch',sans-serif;font-weight:700;letter-spacing:.05em;font-size:clamp(12px,1.85vh,18px);
background:linear-gradient(180deg,#8af5ff,#1fb9dc);transition:.16s;
clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));
box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 10px 26px rgba(53,230,255,.22)}
.btn:hover{transform:translateY(-2px);filter:saturate(1.14) brightness(1.05)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.amber{background:linear-gradient(180deg,#ffe08a,#ff9c2b);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 10px 28px rgba(255,140,43,.3)}
.btn.ghost{background:rgba(10,18,34,.6);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{padding:.5em .8em;--cut:8px}
.icob{width:clamp(30px,4.6vh,40px);aspect-ratio:1;display:grid;place-items:center;padding:0;border:0;cursor:pointer;background:rgba(9,16,32,.66);color:var(--cy);
box-shadow:inset 0 0 0 1px var(--line);transition:.15s}
.icob:hover{color:#fff;background:rgba(53,230,255,.15)}
.icob[aria-pressed="false"]{color:#5b6a86}
.icob svg{width:58%;height:58%}
.lbl{font-family:'Chakra Petch',sans-serif;font-size:.68em;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
.panel{background:linear-gradient(165deg,rgba(14,22,44,.94),rgba(5,8,18,.93));box-shadow:inset 0 0 0 1px var(--line),0 34px 90px rgba(0,0,0,.66)}
.seg{display:inline-flex;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{border:0;background:transparent;color:var(--dim);cursor:pointer;padding:.42em .78em;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:.9em}
.seg button[aria-pressed="true"]{background:var(--cy);color:#03060f}
.sw{position:relative;width:52px;height:24px;border:0;cursor:pointer;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px var(--line)}
.sw::after{content:"";position:absolute;inset:3px auto 3px 3px;width:18px;background:var(--dim);transition:.18s}
.sw[aria-pressed="true"]{background:rgba(53,230,255,.28)}
.sw[aria-pressed="true"]::after{transform:translateX(28px);background:var(--cy)}
.row{display:flex;align-items:center;justify-content:space-between;gap:1em;padding:.6em 0;border-bottom:1px dashed rgba(120,180,255,.14)}
.row:last-child{border:0}
.k{font-family:'Chakra Petch',sans-serif;font-weight:700;letter-spacing:.1em}
.v{font-family:'Chakra Petch',sans-serif;font-weight:700}
.num{font-family:'Chakra Petch',sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.hide{display:none!important}
.screen{position:absolute;inset:0;display:flex;z-index:6}
#title{display:grid;gap:var(--sp);padding:var(--sp) calc(var(--sp) + 1vw);grid-template-columns:minmax(230px,42%) 1fr;
grid-template-rows:auto 1fr auto;grid-template-areas:"brand aside" "rail aside" "bar bar"}
.brand{grid-area:brand;align-self:start}
.kicker{font-family:'Chakra Petch',sans-serif;letter-spacing:.4em;font-size:.7em;color:var(--cy)}
.kicker b{color:var(--am)}
#word1{font-family:'Michroma',sans-serif;font-size:clamp(30px,8.2vh,90px);line-height:.92;margin:.08em 0 0;text-shadow:0 0 34px rgba(53,230,255,.4)}
#word2{font-family:'Michroma',sans-serif;font-size:clamp(21px,6vh,64px);line-height:.9;margin:0;color:transparent;-webkit-text-stroke:1.4px var(--mg);letter-spacing:.16em}
.tag{margin:.7em 0 0;max-width:34ch;color:#c6d7f2;line-height:1.65;border-left:2px solid var(--am);padding-left:.7em}
.rail{grid-area:rail;align-self:end;display:flex;flex-direction:column;gap:8px;max-width:52ch}
.mode{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.9em;padding:.6em .8em;border:0;cursor:pointer;text-align:start;color:var(--ink);
background:rgba(9,15,30,.5);transition:.16s;font:inherit;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px))}
.mode:hover{background:rgba(20,34,62,.7)}
.mode .glyph{width:2.1em;height:2.1em;display:grid;place-items:center;font-family:'Michroma';font-size:1em;color:#04070f;background:var(--dim)}
.mode .nm{font-family:'Chakra Petch';font-weight:700;letter-spacing:.09em;font-size:1.06em}
.mode[aria-selected="true"]{background:linear-gradient(90deg,rgba(255,194,71,.18),rgba(9,15,30,.35));box-shadow:inset 3px 0 0 var(--am)}
.mode[aria-selected="true"] .glyph{background:var(--am)}
.aside{grid-area:aside;position:relative;padding:clamp(10px,1.8vh,20px);display:flex;flex-direction:column;gap:.7em;align-self:center;justify-self:end;width:min(46ch,44vw)}
.aside h3{margin:0;font-family:'Michroma';font-size:clamp(13px,2.4vh,24px);letter-spacing:.06em}
.aside p{margin:0;color:#b8cbec;line-height:1.7;font-size:.95em;min-height:3.2em}
.bignum{font-family:'Chakra Petch';font-weight:700;font-size:clamp(22px,5.4vh,54px);line-height:1;text-shadow:0 0 24px rgba(53,230,255,.4)}
.bar{height:4px;background:rgba(255,255,255,.1)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--am));transition:width .5s cubic-bezier(.2,.9,.2,1)}
#shipCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:8px;margin-top:.3em}
.card{position:relative;padding:.7em;cursor:pointer;text-align:start;border:0;color:var(--ink);background:rgba(7,12,24,.7);box-shadow:inset 0 0 0 1px var(--line);transition:.15s;font:inherit;
clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px))}
.card:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px var(--cy)}
.card[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--am),0 0 30px rgba(255,194,71,.18)}
.card .sw2{height:3px;margin:.5em 0}
.card .nm{font-family:'Chakra Petch';font-weight:700;letter-spacing:.12em}
.card .lk{position:absolute;inset:0;background:rgba(3,6,14,.82);display:grid;place-items:center;font-family:'Chakra Petch';font-size:.78em;color:var(--am)}
.barline{display:grid;grid-template-columns:3.2em 1fr;align-items:center;gap:.6em;font-size:.6em}
.actionbar{grid-area:bar;display:flex;flex-wrap:wrap;align-items:center;gap:.6em;padding-top:.2em}
.langs{display:flex;flex-wrap:wrap;gap:4px;margin-inline-start:auto}
.langs button{border:0;cursor:pointer;background:transparent;color:var(--dim);padding:.42em .5em;font-size:.86em;font-weight:700;font-family:'Chakra Petch'}
.langs button[aria-pressed="true"]{color:#03060f;background:var(--cy)}
.modal{margin:auto;position:relative;width:min(96ch,92vw);max-height:88vh;overflow:auto;padding:clamp(12px,2.4vh,28px)}
.modal h2{margin:0 0 .2em;font-family:'Michroma';font-size:clamp(15px,3vh,32px);letter-spacing:.05em}
.sub{color:var(--dim);margin:0 0 1em;letter-spacing:.06em;font-size:.93em}
.resgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(10px,2vh,24px)}
.rows>div{display:flex;justify-content:space-between;align-items:baseline;padding:.4em 0;border-bottom:1px dashed rgba(120,180,255,.14)}
.rows .v{font-size:1.1em}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.05)}100%{transform:none;opacity:1}}
.pop{animation:pop .4s cubic-bezier(.2,.9,.2,1) both}
.recs{display:inline-block;color:#04070f;background:var(--am);padding:.2em .6em;font-family:'Chakra Petch';font-weight:700;letter-spacing:.1em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:var(--mg);color:#fff}}
.howgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.howgrid>div{padding:.9em;background:rgba(7,12,24,.6);box-shadow:inset 0 0 0 1px var(--line)}
.howgrid h4{margin:0 0 .35em;font-family:'Chakra Petch';letter-spacing:.14em;color:var(--cy);font-size:.9em}
.howgrid p{margin:0;color:#c0d2ef;line-height:1.6;font-size:.9em}
.kbd{font-family:'Chakra Petch';font-weight:700;font-size:.74em;padding:.16em .45em;background:#0d1730;box-shadow:inset 0 0 0 1px var(--line);margin-right:4px}
.credits{margin-top:1em;font-size:.68em;color:#5f7091;letter-spacing:.16em;font-family:'Chakra Petch'}
#hud{position:absolute;inset:0;z-index:5;pointer-events:none;font-family:'Chakra Petch',sans-serif;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 12px)}
#hud>*{position:absolute}
#hL{left:calc(env(safe-area-inset-left,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 6px)}
#scoreV{font-size:clamp(22px,4.9vh,52px);font-weight:700;line-height:.95;text-shadow:0 0 22px rgba(53,230,255,.55);font-variant-numeric:tabular-nums}
#hBestV{font-size:.9em;color:var(--am);letter-spacing:.1em}
#hC{left:50%;top:calc(env(safe-area-inset-top,0px) + 4px);transform:translateX(-50%);text-align:center}
#hMode{font-size:.68em;letter-spacing:.36em;color:var(--cy)}
#hSurge{font-size:clamp(11px,1.9vh,18px);font-weight:700;letter-spacing:.14em;color:var(--am)}
#chipStorm{margin-top:2px;font-size:.66em;letter-spacing:.24em;color:var(--vi);opacity:0;transition:.2s}
#chipStorm.on{opacity:1;animation:blink .8s steps(2) infinite}
#hR{right:calc(env(safe-area-inset-right,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 6px);text-align:end}
#syncV{font-size:clamp(16px,3.4vh,34px);font-weight:700;color:var(--gr)}
#hSyncBar{width:clamp(70px,13vw,140px);height:4px;background:rgba(255,255,255,.12);margin-top:3px}
#hR2{right:calc(env(safe-area-inset-right,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 5.6vh);text-align:end}
#hTimeV{font-size:clamp(17px,3.6vh,38px);font-weight:700;font-variant-numeric:tabular-nums}
#hTimeV.warn{color:var(--mg);animation:blink .6s steps(2) infinite}
#hB{left:calc(env(safe-area-inset-left,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
#pips{display:flex;gap:5px;margin:5px 0}
#pips i{width:11px;height:11px;transform:rotate(45deg);background:var(--cy);box-shadow:0 0 12px rgba(53,230,255,.7)}
#pips i.off{background:rgba(255,255,255,.1);box-shadow:none}
#hIon{width:clamp(110px,22vw,230px);height:7px;background:rgba(255,255,255,.13)}
#hIonV{height:100%;background:linear-gradient(90deg,var(--cy),#eafcff)}
#hIonV.hot{background:linear-gradient(90deg,var(--am),#fff)}
#hIonV.low{background:linear-gradient(90deg,var(--rd),#ff8a9c)}
#hDistV{font-size:clamp(11px,2vh,18px);letter-spacing:.12em;color:#cfe3ff}
#hKills{font-size:.66em;letter-spacing:.2em;color:var(--am2);display:block;margin-bottom:2px}
#hudBtns{right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:6px;pointer-events:auto}
#bossWrap{left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 9.5vh);text-align:center;width:min(46ch,60vw);opacity:0;transition:opacity .3s}
#bossWrap.on{opacity:1}
#bossName{font-family:'Chakra Petch';font-weight:700;letter-spacing:.4em;color:var(--mg);font-size:.78em}
#bossBar{height:8px;background:rgba(255,255,255,.12);margin-top:4px;box-shadow:inset 0 0 0 1px rgba(255,46,136,.4)}
#bossBar i{display:block;height:100%;background:linear-gradient(90deg,var(--mg),var(--am));transition:width .12s linear}
#banner{left:50%;top:26%;transform:translateX(-50%);text-align:center;opacity:0}
#banner b{display:block;font-family:'Michroma';font-size:clamp(17px,4.4vh,48px);letter-spacing:.05em;text-shadow:0 0 30px rgba(255,194,71,.55)}
#banner span{font-family:'Chakra Petch';letter-spacing:.28em;font-size:.84em;color:var(--cy)}
#banner.on{animation:bA 1.6s ease-out}
@keyframes bA{0%{opacity:0;transform:translateX(-50%) scale(.82)}16%{opacity:1;transform:translateX(-50%) scale(1)}74%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-14px)}}
#touch{position:absolute;inset:0;z-index:4;pointer-events:none}
#stick{position:absolute;left:0;bottom:0;width:48%;height:72%;pointer-events:auto}
#stickN{position:absolute;left:0;bottom:0;width:0;height:0;opacity:0;transition:opacity .15s;transform:translate(-50%,-50%)}
#stickN.on{opacity:1}
#stickN .ring{position:absolute;width:112px;height:112px;left:-56px;top:-56px;border-radius:50%;border:1px solid rgba(53,230,255,.4);background:radial-gradient(circle,rgba(53,230,255,.09),transparent 70%)}
#stickN .knob{position:absolute;width:52px;height:52px;left:-26px;top:-26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b8f4ff,#1091b6);box-shadow:0 0 24px rgba(53,230,255,.6)}
#btns{position:absolute;right:calc(env(safe-area-inset-right,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:auto;display:flex;align-items:flex-end;gap:10px}
#bcol{display:flex;flex-direction:column;gap:10px;align-items:center}
.ab{position:relative;width:clamp(58px,11vh,92px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;color:#03060f;font-family:'Chakra Petch';font-weight:700;font-size:.7em;letter-spacing:.04em;display:grid;place-items:center;
box-shadow:inset 0 0 0 2px rgba(255,255,255,.32),0 0 26px rgba(0,0,0,.4);transition:transform .1s,filter .1s}
.ab:active,.ab.hold{transform:scale(.91);filter:brightness(1.28)}
.ab.fire{width:clamp(72px,13.5vh,112px);background:radial-gradient(circle at 40% 30%,#fff,#ff2e88 52%,#7c1046);color:#fff}
.ab.boost{background:radial-gradient(circle at 40% 32%,#fff,#ffc247 55%,#ff7a2e)}
.ab.pulse{background:radial-gradient(circle at 40% 32%,#fff,#35e6ff 55%,#0f5f7a)}
.ab.dim{filter:grayscale(.85) brightness(.55)}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:grid!important}}
#rotate{position:absolute;inset:0;z-index:20;display:none;place-items:center;text-align:center;background:rgba(3,5,12,.92);padding:8vw}
#rotate .ph{width:56px;height:92px;border:2px solid var(--cy);border-radius:9px;margin:0 auto 18px;animation:rot 2.4s ease-in-out infinite}
@keyframes rot{40%,100%{transform:rotate(90deg)}70%{transform:rotate(90deg) scale(1.05)}}
#toasts{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 15%);transform:translateX(-50%);z-index:13;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{padding:.5em 1em;background:rgba(5,9,20,.92);box-shadow:inset 0 0 0 1px var(--am);color:#ffe6b0;font-family:'Chakra Petch';font-weight:700;letter-spacing:.1em;animation:tin .3s cubic-bezier(.2,.9,.2,1) both,tout .4s 2.5s both}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.9)}}@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
#boot{position:absolute;inset:0;z-index:22;display:grid;place-items:center;background:#03040b}
#boot .l{font-family:'Michroma';letter-spacing:.4em;color:var(--cy);animation:blink 1.4s steps(3) infinite}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
<div id="bg" class="fx"><b class="g1"></b><b class="g2"></b></div>
<div id="hlines" class="fx"></div>
<canvas id="gl"></canvas>
<div id="speed" class="fx"></div><div class="fx scan"></div><div class="vig fx"></div>
<div id="hurt" class="fx"></div><div id="heal" class="fx"></div>
<div id="eL" class="edge"></div><div id="eR" class="edge"></div><div id="eT" class="edge"></div><div id="eB" class="edge"></div>

<div id="hud" class="hide">
 <div id="hL"><span class="lbl" data-i18n="score"></span><div id="scoreV">0</div><div id="hBestV" class="num">0</div></div>
 <div id="hC"><div id="hMode"></div><div id="hSurge"></div><div id="chipStorm">◈ MAGNET STORM</div></div>
 <div id="hR"><span class="lbl" data-i18n="sync"></span><div id="syncV">×1</div><div id="hSyncBar"></div></div>
 <div id="hR2"><span class="lbl" data-i18n="time"></span><div id="hTimeV">—</div></div>
 <div id="hB"><span id="hKills">KILLS 0</span><span id="hDistV">0 m</span><div id="pips"></div><div id="hIon"><div id="hIonV"></div></div></div>
 <div id="bossWrap"><div id="bossName">WARDEN</div><div id="bossBar"><i style="width:100%"></i></div></div>
 <div id="hudBtns">
  <button class="icob" id="bSfx2" aria-pressed="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h3l5-4v14l-5-4H4z"/><path d="M16 8c2 1.5 2 6.5 0 8" stroke="currentColor" fill="none" stroke-width="1.6"/></svg></button>
  <button class="icob" id="bPause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
 </div>
 <div id="banner"><b></b><span></span></div>
</div>

/* ================= OBJECT UPDATE ================= */
function updObjs(gdt,play){
for(var i=ACT.length-1;i>=0;i--){var o=ACT[i];if(o.dead)continue;
var ds=o.s-p.s;o.t+=gdt;
if(o.kind==='drone'&&play){o.ox+=clamp(p.x-o.ox,-1,1)*gdt*(5.2+diff()*3.4);o.oy+=clamp(p.y-o.oy,-1,1)*gdt*4.2;o.s-=gdt*8.5;
o.group.children[0].rotation.y+=gdt*2.4;o.group.children[0].rotation.z+=gdt*1.6;ds=o.s-p.s;}
else if(o.kind==='stinger'){o.s+=o.dvs*gdt;
if(o.t<.7){if(o.warn)o.warn.material.opacity=Math.abs(Math.sin(o.t*24))*.65;ds=o.s-p.s;}
else{o.dvs=-22;if(o.warn)o.warn.material.opacity=0;o.ox+=o.dir*40*gdt;
if(o.ox>20||o.ox<-20)free(o);ds=o.s-p.s;}}
else if(o.kind==='saw'){o.group.children[0].rotation.z+=gdt*6;o.oy=Math.sin(o.t*o.spd+o.ph)*o.amp;o.group.children[1].rotation.y+=gdt*3;}
else if(o.kind==='crusher'){if(ds<44){o.gap=Math.max(1.3,o.gap-gdt*6.4);o.a.position.y=o.gap/2+2.4;o.b.position.y=-(o.gap/2+2.4);}}
else if(o.kind==='bar'){o.oy+=Math.sin(tGlobal*1.5+o.s*.1)*gdt*o.dir*1.6;}
else if(o.kind==='mineProx'){o.group.children[0].rotation.y+=gdt*1.6;
var near=ds<20&&Math.abs(o.ox-p.x)<10&&Math.abs(o.oy-p.y)<8&&play;
if(o.ring2)o.ring2.scale.setScalar(1+(near?.4+Math.sin(o.t*14)*.25:0));}
else if(o.kind==='turret'){o.s+=o.dvs*gdt;
o.eye.material.color.setHex(o.fire<.5?0xffffff:0xff2e88);o.eye.scale.setScalar(o.fire<.5?3:1.6);
if(o.fire<.14){o.fire=1.5;var tx=p.x-o.ox,ty=p.y-o.oy,L=Math.hypot(tx,ty)||1;
for(var q=-1;q<=1;q++){var ang=Math.atan2(ty,tx)+q*.16;
fireEB(o.ox,o.oy,o.s-3,Math.cos(ang)*40,Math.sin(ang)*40,0xff2e88);}SFX.laser();}
o.fire-=gdt;}
else if(o.kind==='boss'&&play){o.s=p.s+56;o.ox=Math.sin(o.t*.7)*9;o.oy=Math.cos(o.t*.52)*4;
o.group.children[2].rotation.z+=gdt*.8;o.core.material.opacity=.6+Math.sin(o.t*8)*.3;
o.timer-=gdt;var hpf=o.hp/28;
if(o.timer<=0){o.phase=(o.phase+1)%3;
if(o.phase===0){o.timer=2.6;var rn=10+pLevel;for(var a=0;a<rn;a++){var th=a/rn*6.283;fireEB(o.ox,o.oy,o.s-4,Math.cos(th)*27,Math.sin(th)*27,0xffc247);}SFX.laser();}
else if(o.phase===1){o.timer=1.8;for(var q2=-1;q2<=1;q2++){var an=Math.atan2(p.y-o.oy,p.x-o.ox)+q2*.18;fireEB(o.ox,o.oy,o.s-5,Math.cos(an)*46,Math.sin(an)*46,0xff2e88);}SFX.laser();}
else{o.timer=3;if(o.hp>10){place('drone',p.s+40,o.ox,o.oy);}}}
ds=o.s-p.s;}
o.group.position.set(pathX(o.s)+o.ox,pathY(o.s)+o.oy,-o.s);
if(o.kind!=='boss'&&(ds>96||ds<-90)){free(o);continue;}
if(!play)continue;
var dx=p.x-o.ox,dy=p.y-o.oy;
if(o.kind==='ring'){if(!o.done&&ds<=0){o.done=true;
if(dx*dx+dy*dy<(o.r-1)*(o.r-1)){p.rings++;p.combo=Math.min(8,p.combo+1);p.maxCombo=Math.max(p.maxCombo,p.combo);
if(p.def.ion<9)p.ion=Math.min(100,p.ion+5*p.def.ion);addScore(130);SFX.ring(p.combo);
burst(o.group.position.x,o.group.position.y,o.group.position.z,0x35e6ff,1);
emit(o.group.position.x,o.group.position.y,o.group.position.z,16,0x9ff4ff,{sp:9,life:.6,sz:2.2,z:8});
if(mode==='rush')time+=1.4;if(p.combo>=8)banner(tr('perfect'),'×8');}
else{p.combo=1;SFX.ui();}}}

(on?'':'<span class="lk">'+tr('locked_at')+' '+(s.need/1000)+'k</span>');

c.appendChild(b);})(SHIPS[i]);}}

(function(){var ms=document.querySelectorAll('.mode');

$('pRestart').onclick=function(){SFX.ui();$('pause').classList.add('hide');start(mode);};
$('pExit').onclick=function(){SFX.ui();$('pause').classList.add('hide');toMenu();};
function swSet(el,v){el.setAttribute('aria-pressed',v?'true':'false');}

swSet($('bSfx'),SAVE.sfx);swSet($('bMus'),SAVE.music);swSet($('bSfx2'),SAVE.sfx);
var qs=document.querySelectorAll('#setQ button');for(var i=0;i<qs.length;i++)qs[i].setAttribute('aria-pressed',qs[i].getAttribute('data-q')===SAVE.quality?'true':'false');
if(AU.sfx)AU.sfx.gain.value=SAVE.sfx?1:0;if(AU.mus)AU.mus.gain.value=SAVE.music?.8:0;}
function tSfx(){audioInit();SAVE.sfx=!SAVE.sfx;save();syncSettings();SFX.ui();}
function tMus(){audioInit();SAVE.music=!SAVE.music;save();syncSettings();SFX.ui();}

$('setMus').onclick=$('bMus').onclick=tMus;
